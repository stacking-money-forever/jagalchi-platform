name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Web, Mobile, and shared API client
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jagalchi/mobile exec expo install --check
      - run: pnpm --filter @jagalchi/web check:consumer-contracts
      - run: pnpm check:v1-harness
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_REALTIME_URL: http://localhost:8080
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_ENV: development
          NEXT_PUBLIC_API_MOCKING: "false"
          NEXT_PUBLIC_REALTIME_ENABLED: "false"

  browser:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jagalchi/web exec playwright install --with-deps chromium
      - run: pnpm --filter @jagalchi/web build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_API_MOCKING: "true"
          NEXT_PUBLIC_E2E_MOCKING: "true"
          NEXT_PUBLIC_REALTIME_ENABLED: "true"
          NEXT_PUBLIC_REALTIME_URL: https://api.example.com
          NEXT_PUBLIC_EVIDENCE_EXECUTION_ENABLED: "true"
          NEXT_PUBLIC_PROOF_PROFILE_ENABLED: "true"
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
      - run: pnpm --filter @jagalchi/web test:e2e
        env:
          E2E_USE_PRODUCTION_SERVER: "true"
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_API_MOCKING: "true"
          NEXT_PUBLIC_E2E_MOCKING: "true"
          NEXT_PUBLIC_REALTIME_ENABLED: "true"
          NEXT_PUBLIC_REALTIME_URL: https://api.example.com
          NEXT_PUBLIC_EVIDENCE_EXECUTION_ENABLED: "true"
          NEXT_PUBLIC_PROOF_PROFILE_ENABLED: "true"
